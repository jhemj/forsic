    <path d="M49 78v8m78-8v8" stroke="#4b95bd" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(137 126)">
      <circle r="17" fill="#111a26" stroke="#50677d" stroke-width="1.5"/>
      <path d="M-4-8h-4v4m12-4h4v4M-8 4v4h4m12-4v4H4" stroke="#6dccff" stroke-width="2" stroke-linecap="round"/>
      <circle class="ren-signal" r="3" fill="#62caff"/>
    </g>
    <circle class="ren-signal" cx="140" cy="40" r="3" fill="#56bfff"/>
  </g>
</svg>
